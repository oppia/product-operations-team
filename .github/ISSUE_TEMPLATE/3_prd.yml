name: PRD/Requirements request
description: Submit a request for creating a new PRD or making a product decision
title: "[PRD/Requirements]: "
body:
  - type: textarea
    id: issue-description
    attributes:
      label: Description of the problem
    validations:
      required: true
  - type: textarea
    id: possible-solutions
    attributes:
      label: Possible solutions / ideas for addressing the problem
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Any other relevant context/info
      description: Add any other context about the request here.
    validations:
      required: false

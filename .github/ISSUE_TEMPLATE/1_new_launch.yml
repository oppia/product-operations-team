name: New Feature Launch
description: Submit a request for coordinating a new feature launch
title: "[New Feature Launch]: "
body:
  - type: markdown
    attributes:
      value: >
        Thanks for submitting a request for a new feature launch! Please fill in the details 
        below so that we can process it.

        Note that new feature launches should follow 
        [these steps](https://github.com/oppia/oppia/wiki/Launching-new-features#how-to-use-feature-flags).
  - type: dropdown
    id: product-id
    attributes:
      label: Product
      description: Which platform/team owns this feature?
      options:
        - Web (LaCE)
        - Web (Contributor Dashboard)
        - Android
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: Brief description of the feature. Include links to PRD and TDD, where possible.
    validations:
      required: true
  - type: input
    id: pre-launch-review-doc-link
    attributes:
      label: Link to the Pre-Launch Review Doc for this feature
      description: >
        This should be a document that follows
        [this template](https://docs.google.com/document/d/1ibQC9t1jnOg-o1lrHEM3QEXeF4eSqAiPhs2lD2iCpy4/edit?tab=t.4t336fwwj9ly).
    validations:
      required: true
  - type: input
    id: drive-folder-link
    attributes:
      label: Link to the ProdOps Drive folder for this feature
      description: >
        This should be a subfolder of the [ProdOps Feature Launch folder](https://drive.google.com/drive/folders/10TW7dUApMoBW4mhEh_JFuQxldWNudPv0). 
        Ask a ProdOps lead or Tech Lead to make one for you if needed. The folder should include the pre-launch doc above,
        as well as any related documents (PRD, TDD, CUJs, etc.).
    validations:
      required: true
  - type: input
    id: test-stage-PR
    attributes:
      label: Link to the PR which moved the flag to the TEST feature stage
      description: >
        To be eligible for launch, your feature flag must be in the TEST stage.
        See guidance [here](https://github.com/oppia/oppia/wiki/Launching-new-features#how-to-use-feature-flags).
        The tech lead can fill this in later once the feature is ready.
    validations:
      required: false
  - type: input
    id: google-space-link
    attributes:
      label: Link to the launch command channel for this feature.
      description: The tech lead will add this when handing off to ProdOps.
    validations:
      required: false
  - type: input
    id: developer-id
    attributes:
      label: Developer point-of-contact
      description: GitHub username of the primary feature developer
    validations:
      required: true
  - type: checkboxes
    id: responsible-tls
    attributes:
      label: Dev Leads
      description: Who are the responsible dev leads for this feature?
      options:
        - label: kevintab95
        - label: U8NWXD
        - label: HardikGoyal2003
        - label: mon4our
        - label: NITISH084
        - label: BenHenning
        - label: adhiamboperes
        - label: subhajitxyz        
    validations:
      required: true
  - type: dropdown
    id: expected-code-complete-date
    attributes:
      label: Expected code-complete date
      description: This should include implementation of any analytics events noted in the PRD.
      options:
        - 2025 Q4
        - 2026 Q1
        - 2026 Q2
        - 2026 Q3
        - 2026 Q4
        - 2027 Q1
        - 2027 Q2
    validations:
      required: true
  - type: checkboxes
    id: testing-roles
    attributes:
      label: Required roles for testing
      description: Which role permissions are needed to test this feature?
      options:
        - label: Curriculum admin
        - label: Topic manager
        - label: Question admin/coordinator
        - label: Question reviewer
        - label: Question submitter
        - label: Translation admin/coordinator
        - label: Translation reviewer
        - label: Translation submitter
        - label: Voiceover admin
        - label: Blog admin
        - label: Blog post editor
        - label: None of the above
    validations:
      required: true
  - type: input
    id: feature-flag-name
    attributes:
      label: Feature flag name
      description: Name of the feature flag that needs to be flipped to enable this feature
    validations:
      required: true
  - type: input
    id: feature-flag-min-version
    attributes:
      label: (Android only) Minimum supported Android version
      description: Specify the minimum Android version to enable the feature flag for
    validations:
      required: false
  - type: textarea
    id: any-other-info
    attributes:
      label: (Optional) Is there anything else you would like the ProdOps team to know?
      description: >
        For example, anything in particular that you would like feedback on during testing. The ProdOps
        team will include this request when corresponding with the QA team.
    validations:
      required: false
  - type: textarea
    id: instructions-for-prodops
    attributes:
      label: Instructions for Dev Leads, Prod Ops and QA Teams
      description: Please leave this section as-is.
      value: |
        ------

        When you are assigned to this issue, please complete the steps below in order. Tick
        each checkbox as you complete the step. All launch communication must happen in the
        feature's **Launch Google Space**.

        #### Phase 1: Tech Lead Setup and Verification (Owner: Tech Lead)
        - [ ] **Verify Drive Folder & Docs:** Confirm the feature's folder is in the [ProdOps Feature Launch Folder](https://drive.google.com/drive/folders/10TW7dUApMoBW4mhEh_JFuQxldWNudPv0) and that it contains the actual files (not shortcuts) for the **PRD**, **TDD**, **Tech Launch Plan** (if migrations/manual steps are needed, using [this template](https://docs.google.com/document/d/1AmECWsG8KQcYDtB91725MHfN0G6hp86HEiV_okXspNg/edit?tab=t.0)), and the completed **Pre-Launch Review Doc** (with *"Information for Testers"* and *"Information for Server Admins"* filled in).
        - [ ] Ensure the relevant product's CUJ sheet includes this feature with status **"GATED"** (file a [CUJ Change Request](https://github.com/oppia/product-operations-team/issues/new?template=4_cuj_change_request.yml) issue if needed).
        - [ ] Confirm that automated acceptance tests cover all new/updated CUJs, and complete the *"Evaluation of Automated Tests"* columns in the CUJ sheet.
        - [ ] **Deploy & Test on Backup Server**
          - [ ] Merge the `TEST`-stage flag PR, deploy to the backup server, run any Tech Launch Plan steps, and turn the flag ON.
          - [ ] Walk through all CUJs on the backup server to verify technical functionality and confirm analytics events fire as expected.
        - [ ] Ensure the ProdOps assignee and QA Leads have the required testing roles on the backup server.
        - [ ] **Create Launch Google Space:**
          - [ ] Create a Space titled `[Launch] <Feature_Name>` and invite: Developer, Dev Leads, ProdOps, UXD/UXR, QA, and Marketing.
          - [ ] Pin a welcome post with links to: (1) Pre-Launch Doc, (2) this GitHub Issue, (3) Drive Folder, (4) PRD/TDD.
          - [ ] Send a message to `@all` asking them to set Space notifications to **"All"**, subscribe to this GitHub issue, and subscribe to [comment/edit notifications](https://support.google.com/docs/answer/91588?hl=en&co=GENIE.Platform%3DDesktop) on the Pre-Launch Doc.
        - [ ] **Handoff to ProdOps:** Assign this issue to the ProdOps owner and tag them in the Space. *(Check this item off only after the ProdOps owner has acknowledged the handoff.)*

        #### Phase 2: Dry-Run, Analytics & QA Testing (Owners: ProdOps & QA)
        - [ ] Confirm the feature is in the [Marketing Tracker](https://docs.google.com/spreadsheets/d/1zkucuPbuFp9gzJXcWKjoZCqwDTT24xY1ufSX7ku9JAo/edit?gid=0#gid=0).
        - [ ] Decide with UXR if a **Trusted Tester** phase is required.
        - [ ] File an [issue](https://github.com/oppia/analytics-data-platform/issues/new?template=02_new_feature.yml) on the **Product Analytics tracker** to set up the Looker Studio dashboard and BigQuery queries for this feature. **Link to Analytics Issue / Dashboard:** ________.
        - [ ] Add a link to the backup server's Looker Studio dashboard in the *"Information for Testers"* section of the Pre-Launch Review Doc.
        - [ ] **ProdOps Dry-Run:**
          - [ ] Test the feature end-to-end on the backup server. File any bugs/design issues and re-test until resolved. Post the sign-off report to this GitHub issue.
          - [ ] Verify that events expected from the dry-run were accurately recorded on the Analytics Looker Studio dashboard.
        - [ ] **QA Testing Loop:**
          - [ ] Tag `@qa-leads` in the Launch Space to begin full QA testing (coordinating with Tech Leads to grant backup-server access to additional tester usernames as needed).
          - [ ] Developer fixes any reported bugs and adds automated test coverage; QA re-tests until zero blocking bugs remain.
          - [ ] ProdOps periodically checks the Looker Studio dashboard during QA testing to confirm that metrics are recording accurately and raises issues to the Technical and Product Analytics teams as needed.
          - [ ] **QA Sign-Off:** QA Leads confirm in the Launch Space that testing is complete.
        - [ ] **Trusted Tester Phase (if applicable):** Complete the Trusted Tester run with UXR. *(Check this box immediately if a Trusted Tester phase is not needed.)*
        - [ ] Address any remaining QA findings/caveats and formally greenlight the launch.
        - [ ] Ask Tech Leads to merge the PR moving the flag to the `PROD` stage. **Link to PR:** ________.
         
        #### Phase 3: Rollout & Cleanup (Owner: ProdOps)
        - [ ] **Lock in Launch Dates** (with Marketing & Tech Leads):
          - **Binary Deployment Date** (with flag in PROD mode): ________
          - **Marketing Ready Date** (all collateral prepared): ________
          - **Public Launch Date** (must be after the above): ________
        - [ ] **Prod Smoke Test & Analytics Check:**
          - [ ] Confirm the release binary is deployed to PROD and any **Tech Launch Plan** migrations have been executed.
          - [ ] Ask Server Admins to enable the flag in PROD **for the ProdOps assignee only**, and verify the feature works in production.
          - [ ] Check the ProdOps **"CUJ Health"** master analytics dashboard to verify that the new dashboards for this feature have been integrated into it.
        - [ ] **Execute Rollout:**
          - [ ] Work with Server Admins to turn the flag ON in PROD per the rollout schedule (using a partial/gradual rollout if desired to monitor usage, support requests, and system health).
          - [ ] Ask Server Admins to **permanently** set the feature flag to `ON` in the `test`/`backup` servers. *(Only mark this checkbox as complete once they've confirmed it's `ON`.)*
          - **Rollback Rule**: If a P0 bug or server instability occurs, immediately ask Server Admins to disable the flag and alert `@all` in the Launch Space.
        - [ ] **Launch Day Actions (at 100% Rollout):**
          - [ ] Update the feature's rows in the master CUJ sheet from **"GATED"** to **"LIVE"**.
          - [ ] Send a congratulatory launch email to everyone@, with screenshots crediting everyone involved!
        - [ ] **Post-Launch Review & Cleanup (2 Weeks Post-Launch):**
          - [ ] Monitor the feature's Looker Studio dashboard, [GitHub issues](https://github.com/oppia/oppia/issues), and the [Google Group](https://groups.google.com/g/oppia) for 2 weeks.
          - [ ] Compile the [Post-Launch Report](https://docs.google.com/document/d/1DifFAe3oRzjmVPh2fEllfAky4n0QMAXVQc3Y580qkr8/edit) and host a post-launch review with the Launch Space.
          - [ ] Ask Tech Leads to remove the feature flag from the codebase (**Link to PR:** ________), then close this issue. 🎉
    validations:
      required: true

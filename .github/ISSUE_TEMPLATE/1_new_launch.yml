name: New Feature Launch
description: Submit a request for coordinating a new feature launch
title: "[New Feature Launch]: "
body:
  - type: markdown
    attributes:
      value: >
        Thanks for submitting a request for a new feature launch! Please fill in the details 
        below so that we can process it.

        Note that new feature launches should follow 
        [these steps](https://github.com/oppia/oppia/wiki/Launching-new-features#how-to-use-feature-flags).
  - type: dropdown
    id: product-id
    attributes:
      label: Product
      description: Which platform/team owns this feature?
      options:
        - Web (LaCE)
        - Web (Contributor Dashboard)
        - Android
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: Brief description of the feature. Include links to PRD and TDD, where possible.
    validations:
      required: true
  - type: input
    id: pre-launch-review-doc-link
    attributes:
      label: Link to the ProdOps Drive folder for this feature
      description: >
        This should include a pre-launch doc that follows
        [this template](https://docs.google.com/document/d/1ibQC9t1jnOg-o1lrHEM3QEXeF4eSqAiPhs2lD2iCpy4/edit?tab=t.4t336fwwj9ly),
        as well as any related documents (PRD, TDD, CUJs, etc.).
    validations:
      required: true
  - type: dropdown
    id: expected-code-complete-date
    attributes:
      label: Expected code-complete date
      description: This should include implementation of any analytics events noted in the PRD.
      options:
        - 2025 Q2
        - 2025 Q3
        - 2025 Q4
        - 2026 Q1
        - 2026 Q2
        - 2026 Q3
        - 2026 Q4
    validations:
      required: true
  - type: input
    id: developer-id
    attributes:
      label: Developer point-of-contact
      description: GitHub username of the primary feature developer
    validations:
      required: true
  - type: checkboxes
    id: responsible-tls
    attributes:
      label: Dev Leads
      description: Who are the responsible dev leads for this feature?
      options:
        - label: kevintab95
        - label: U8NWXD
        - label: BenHenning
        - label: adhiamboperes
        - label: HardikGoyal2003
        - label: mon4our
        - label: chris7716
        - label: masterboy376
    validations:
      required: true
  - type: checkboxes
    id: testing-roles
    attributes:
      label: Required roles for testing
      description: Which role permissions are needed to test this feature?
      options:
        - label: Curriculum admin
        - label: Topic manager
        - label: Question admin/coordinator
        - label: Question reviewer
        - label: Question submitter
        - label: Translation admin/coordinator
        - label: Translation reviewer
        - label: Translation submitter
        - label: Voiceover admin
        - label: Blog admin
        - label: Blog post editor
        - label: None of the above
    validations:
      required: true
  - type: input
    id: feature-flag-name
    attributes:
      label: Feature flag name
      description: Name of the feature flag that needs to be flipped to enable this feature
    validations:
      required: true
  - type: input
    id: feature-flag-min-version
    attributes:
      label: (Android only) Minimum supported Android version
      description: Specify the minimum Android version to enable the feature flag for
    validations:
      required: false
  - type: input
    id: test-stage-PR
    attributes:
      label: Link to the PR which moved the flag to the TEST feature stage
      description: >
        To be eligible for launch, your feature flag must be in the TEST stage.
        See guidance [here](https://github.com/oppia/oppia/wiki/Launching-new-features#how-to-use-feature-flags).
    validations:
      required: false
  - type: textarea
    id: any-other-info
    attributes:
      label: (Optional) Is there anything else you would like the ProdOps team to know?
      description: >
        For example, anything in particular that you would like feedback on during testing. The ProdOps
        team will include this request when corresponding with the QA team.
    validations:
      required: false
  - type: textarea
    id: instructions-for-prodops
    attributes:
      label: Instructions for ProdOps Team
      description: Please leave this section as-is.
      value: |
        When you are assigned to this issue, please do the following. Tick each
        checkbox item as you complete each step:

        **Tech-lead prep (to be done by a tech lead)**
        - [ ] Ensure that this issue is filed correctly. Ask for any missing info if needed.
        - [ ] Ensure that the "Information for Testers" page of the pre-launch review doc is fully filled in, and that the pre-launch review doc has been moved (not just shortcut-linked) into [this Drive folder](https://drive.google.com/drive/folders/10TW7dUApMoBW4mhEh_JFuQxldWNudPv0).
        - [ ] Ask the developer and the relevant dev team leads to subscribe to this issue thread for updates, and ensure that they've done so.
        - [ ] Verify that the "test stage" PR has been merged (see the "Link to the PR which moved the flag to the TEST feature stage" field), and that it actually moves the feature flag to the TEST stage.
        - [ ] Once the "test stage" PR has been merged, deploy it to the backup-server.
        - [ ] Enable the feature flag on the backup-server.
        - [ ] Verify that the feature's CUJs actually work technically on the backup-server (with the flag enabled). Clarify any CUJs that aren't clear with the developer.
        - [ ] Ensure that the ProdOps assignee has the correct permissions on the backup-server to do a dry-run of the feature.
        - [ ] Hand off this issue to the ProdOps team (deassign yourself and tag/add the correct assignee from ProdOps).

        **Preparation and Dry-Run**
        - [ ] Ensure that the Google Drive folder for this feature has been correctly set up and contains the necessary documents (pre-launch review template, post-launch review template, links/shortcuts to PRDs, TDDs, etc.). Folder link: __________
        - [ ] Verify that the Marketing team's [tracker](https://docs.google.com/spreadsheets/d/1zkucuPbuFp9gzJXcWKjoZCqwDTT24xY1ufSX7ku9JAo/edit?gid=0#gid=0) has a sheet for this product launch.
        - [ ] [LATER, once analytics pipeline is set up] Set up the Looker Studio dashboard for the feature, and supplement it with metrics obtained using BigQuery queries, as needed.
        - [ ] [LATER, once analytics pipeline is set up] Add a link to the backup-server Looker Studio dashboard in the instructions for testers.
        - [ ] Do a full run-through of the feature, and make updates to clarify the CUJ descriptions as needed. Then, post a new comment to this thread with the testing report, and cc the developer and relevant dev team leads. Ensure that any bugs found during this process are filed and assigned to the developer. If you see design issues, it's fine to loop in the design team. If issues were discovered in the run-through, repeat the above as needed until there are no more issues. (Only mark this step as complete once that stage is reached -- at this point, ProdOps is saying "I'm happy with the feature, it can go to full QA.")
        - [ ] [LATER, once analytics pipeline is set up] Verify that events from the testing were correctly recorded on the Looker Studio dashboard.

        **Full feature testing**
        - [ ] Set up a "launch command channel" Google Space for this feature launch and invite all relevant parties (design, developer, QA, campaign strategy team members + leads).
        - [ ] Give the QA leads a heads-up that a new feature will be coming to test soon. Send them the CUJs and request the list of tester usernames. Do the same for any members from the Campaign Strategy and Design teams who want to participate.
        - [ ] Ask the tech leads to provide the necessary permissions to the tester usernames on the backup-server.
        - [ ] Ask QA leads to start the feature testing process. As testing progresses, make updates to clarify the CUJ descriptions as needed. Add a comment to this issue thread with a link to the feature testing report, and cc the developer and relevant dev team leads. Ensure that any new bugs are filed and assigned to the developer. Periodically check the Looker Studio dashboard to verify that metrics are being correctly recorded during feature testing, and adjust the metrics, if needed, to make them more useful. If issues were discovered in the testing, repeat the above as needed until there are no more issues. (Only mark this step as complete once the feature passes testing.)
        - [ ] Tell the tech leads that the feature has passed QA and can be moved to PROD stage. They should link to the PR here once it is merged: ______.
        - [ ] Send a message to the Campaign Strategy leads to let them know that the product is ready for launch. 
        - [ ] If the Campaign Strategy team wants to include a "trusted tester" phase, run through this with them following the guidance in the Product/Marketing Communication Process document.

        **Rollout**
        - [ ] Agree on launch date with Marketing team and tech leads, and document it here. **Launch date**: ______.
        - [ ] [LATER, once analytics pipeline is set up] Check the ProdOps "CUJ health" analytics dashboard to verify that the new dashboards for this feature have been included in it.
        - [ ] Verify that the QA team has added the feature's CUJs to the master CUJ document.
        - [ ] Work with the server admins team to flip the feature flag 5-7 days before the launch date, and confirm that the feature works in production.
        - [ ] Send out a congratulatory launch email, crediting all the folks involved in the launch.
        - [ ] Monitor post-launch metrics through the feature's Looker Studio dashboard (constructed above).
        - [ ] Monitor post-launch feedback through [GitHub](https://github.com/oppia/oppia/issues) issues, filed and [Google Groups forum](https://groups.google.com/g/oppia).
        - [ ] 2 weeks after launch, compile a [post-launch report](https://docs.google.com/document/d/1DifFAe3oRzjmVPh2fEllfAky4n0QMAXVQc3Y580qkr8/edit) and schedule a post-launch review with everyone on the command channel (design, developers, marketing, QA).
        - [ ] Ask the tech leads to remove the feature flag. **Link to PR that removes the flag: _____.**
        - [ ] Close this bug. This concludes the feature launch, congratulations! 🎉
    validations:
      required: true
